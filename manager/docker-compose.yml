services:
  db:
    image: postgres:15
    container_name: exposeu-manager-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '5433:5432'

  api:
    build:
      context: ./api
    container_name: exposeu-manager-api
    environment:
      API_PORT: ${API_PORT}
      API_JWT_SECRET: ${API_JWT_SECRET}
      API_UPLOAD_DIR: ${API_UPLOAD_DIR}
      API_MAX_UPLOAD_BYTES: ${API_MAX_UPLOAD_BYTES}
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - ./uploads:${API_UPLOAD_DIR}
    ports:
      - '4001:4001'
    depends_on:
      - db

  web:
    image: node:20-alpine
    container_name: exposeu-manager-web
    working_dir: /app
    volumes:
      - ./web:/app
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 5175"]
    ports:
      - '5175:5175'

volumes:
  db_data:
